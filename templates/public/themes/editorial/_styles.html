{% comment %}Editorial helpers shared by the inner pages (the home page has its own copy of .ed-ph).{% endcomment %}
<style>
    .ed-ph { display: grid; place-items: center; width: 100%; height: 100%; background: radial-gradient(90% 70% at 50% 35%, #efeee6, #c5c8b8); color: #75786b; }
    .ed-ph-dark { background: radial-gradient(90% 70% at 50% 35%, #2a2f22, #141611); color: rgba(255,255,255,.25); }
    .ed-rule { height: 1px; background: currentColor; opacity: .15; }
    .ed-prose p { margin-bottom: 1rem; }
    .ed-prose p:last-child { margin-bottom: 0; }
    .ed-prose ul { list-style: disc; padding-left: 1.5rem; margin: 1rem 0; }
    .ed-prose ul li { margin-bottom: .5rem; }
    .ed-prose a { color: var(--olive, #33450d); text-decoration: underline; text-underline-offset: 3px; }
    .ed-prose strong { color: var(--page-fg); }
    .ed-field { width: 100%; background: var(--field, #f5f4ec); border: 1px solid rgba(117,120,107,.18); border-radius: 1rem; padding: .8rem 1rem; font-size: .875rem; }
    .ed-field:focus { outline: none; border-color: #33450d; box-shadow: 0 0 0 1px #33450d; }
    /* the shared enquiry form is built for a light card; keep its fields soft and rounded here */
    .ed-form input:not([type=checkbox]):not([type=radio]), .ed-form textarea, .ed-form select { border-radius: 1rem; background: #f5f4ec; border-color: rgba(117,120,107,.2); }
    .ed-form button[type=submit] { background: #1f2e00; }
    .ed-chip { display: inline-flex; align-items: center; gap: .5rem; white-space: nowrap; padding: .7rem 1.4rem; border-radius: 9999px; font-weight: 700; font-size: .85rem; transition: background-color .3s, color .3s; }
    .ed-num { font-family: var(--font-display); font-weight: 700; font-variant-numeric: lining-nums; }
    @media (prefers-reduced-motion: reduce) { .ed-acc-panel { transition: none !important; } }
</style>
