{% comment %}The car that drives the route roads, seen from above and facing right. The viewBox is wider than the car
so the headlight beam fits in front; route.js anchors it on the road at the car's centre (32, 16).{% endcomment %}
<svg viewBox="0 0 120 32" width="120" height="32" overflow="visible">
    <defs>
        <linearGradient id="{{ car_id|default:'car' }}Body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef8a4c"/><stop offset=".5" stop-color="#d9692f"/><stop offset="1" stop-color="#b8521f"/></linearGradient>
        <linearGradient id="{{ car_id|default:'car' }}Beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".75"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></linearGradient>
    </defs>
    <path class="car-beam" d="M60 6 L118 -8 L118 40 L60 26 Z" fill="url(#{{ car_id|default:'car' }}Beam)"/>
